name: Static checks
description: The POM conventions check, the core boundary check, the tests of the scripts, the TypeScript type-check and the linter. Run after the setup action.

runs:
  using: composite
  steps:
    - name: Check POM conventions
      shell: bash
      run: npx --no pom-harness check-conventions

    - name: Check the core boundary and case IDs
      shell: bash
      run: node scripts/check-core-boundary.mjs

    - name: Test the scripts
      shell: bash
      run: npm run test:scripts

    - name: Type-check
      shell: bash
      run: npm run typecheck

    - name: Lint (floating promises, missing awaits, focused tests)
      shell: bash
      run: npm run lint
