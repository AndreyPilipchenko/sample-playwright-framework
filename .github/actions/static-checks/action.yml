name: Static checks
description: The POM conventions check, the core boundary check, the README count check, the harness version check, the tests of the scripts, the TypeScript type-check and the linter. Run after the setup action.

runs:
  using: composite
  steps:
    - name: Check POM conventions
      shell: bash
      run: npm run check:conventions

    - name: Check the core boundary and case IDs
      shell: bash
      run: npm run check:boundary

    - name: Check the README counts against the specs
      shell: bash
      run: npm run check:readme

    - name: Check the package versions the harness supports
      shell: bash
      run: npm run check:harness-versions

    - name: Test the scripts
      shell: bash
      run: npm run test:scripts

    - name: Type-check
      shell: bash
      run: npm run typecheck

    - name: Lint (floating promises, missing awaits, focused tests)
      shell: bash
      run: npm run lint
