name: Run Playwright specs
description: >-
  Runs Playwright headless and non-interactively, publishes the HTML and Allure reports as
  artifacts whatever the outcome, then fails the step if the specs failed. Run after the
  setup action.

inputs:
  command:
    description: The command that runs the specs.
    default: npx playwright test
  args:
    description: Arguments appended to the command (projects, --grep, --shard, ...).
    default: ''
  report-name:
    description: Suffix of the artifact names (playwright-report-<name>, allure-report-<name>); must be unique within the run.
    required: true

outputs:
  exit-code:
    description: The exit code of the spec run (0 when every spec passed).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    # The exit code is captured, not acted on, so the reports below always publish; the last
    # step fails the action. CI=true turns on retries and the CI trace policy; the other two
    # variables stop the Allure and HTML report viewers from opening (they would hang a runner).
    - name: Run the specs
      id: run
      shell: bash
      env:
        CI: 'true'
        AUTO_ALLURE_OPEN: 'false'
        PW_TEST_HTML_REPORT_OPEN: never
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
      run: |
        set +e
        # Word splitting is intended: COMMAND and ARGS are space-separated argument lists.
        # shellcheck disable=SC2086
        $COMMAND $ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    # A selection with no specs writes no reports; that is not an error.
    - name: Publish HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ inputs.report-name }}
        path: reports/playwright-report
        retention-days: 30
        if-no-files-found: ignore

    - name: Publish current Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ inputs.report-name }}
        path: reports/allure-report/index.html
        retention-days: 30
        if-no-files-found: ignore

    - name: Reflect test outcome
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        if [ "${EXIT_CODE:-1}" != "0" ]; then
          echo "::error::The specs failed (exit code ${EXIT_CODE:-unknown}); see the reports above."
          exit 1
        fi
