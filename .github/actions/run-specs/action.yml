name: Run Playwright specs
description: >-
  Runs Playwright headless and non-interactively, writes a results summary to the job's
  Summary page and publishes the HTML and Allure reports as artifacts whatever the outcome,
  then fails the step if the specs failed. Run after the setup action.

inputs:
  command:
    description: The command that runs the specs.
    default: npx playwright test
  args:
    description: Arguments appended to the command (projects, --grep, ...).
    default: ''
  report-name:
    description: Suffix of the artifact names (playwright-report-<name>, allure-report-<name>); must be unique within the run.
    required: true
  stage-tag:
    description: The tag this job always runs (e.g. @smoke); the filters below narrow it further.
    default: ''
  tag:
    description: Manual-run filter. Tags, separated by commas or spaces; a test matches if it has any of them (e.g. "@smoke, @regression").
    default: ''
  name:
    description: Manual-run filter. Text the test title must contain, case-insensitive (e.g. "admin credentials").
    default: ''
  publish-html-report:
    description: >-
      'true' uploads the Playwright HTML report as an artifact. Pass 'false' when the run signs in
      with shared credentials and the artifacts would be public: its failure pages and traces can
      contain them. The Allure report and the traces of failed tests are always published.
    default: 'true'
  paths:
    description: Manual-run filter. Spec files or folders, separated by spaces, optionally with :line (e.g. "tests/ui/accounts/LoginTests.spec.ts:38").
    default: ''

outputs:
  exit-code:
    description: The exit code of the spec run (0 when every spec passed).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    # The exit code is captured, not acted on, so the summary and reports below always run; the last
    # step fails the action. CI=true turns on retries and the CI trace policy; the other two
    # variables stop the Allure and HTML report viewers from opening (they would hang a runner).
    #
    # Selection: Playwright takes a single --grep, so the job tag, the tag filter and the name
    # filter become lookaheads of one expression (a test must match all of them). Paths are
    # positional file filters. Inputs arrive through env, never spliced into the script.
    - name: Run the specs
      id: run
      shell: bash
      env:
        CI: 'true'
        AUTO_ALLURE_OPEN: 'false'
        PW_TEST_HTML_REPORT_OPEN: never
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
        STAGE_TAG: ${{ inputs.stage-tag }}
        TAGS: ${{ inputs.tag }}
        NAME: ${{ inputs.name }}
        PATHS: ${{ inputs.paths }}
      run: |
        set +e
        # Another deployment needs both addresses, or the UI and API would be different systems.
        if [ -n "${APP_URL:-}${APP_API_URL:-}" ]; then
          address='^https?://[^[:space:]]+$'
          if ! [[ ${APP_URL:-} =~ $address && ${APP_API_URL:-} =~ $address ]]; then
            echo "::error::A run against another deployment needs both app_url and api_url, each starting with http:// or https://."
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export APP_URL="${APP_URL%/}" APP_API_URL="${APP_API_URL%/}"
        fi
        # A job can call this action more than once. Without this, a call that writes no report would be
        # summarized, and saved for the next comparison, with the previous call's results, and
        # a call whose Allure report fails would publish the previous call's report as its own.
        rm -f reports/json-report/test-results.json reports/json-report/results-slim.json reports/ci-baseline/results.json reports/allure-report/index.html
        # Regex-escapes literal text.
        escape() { printf '%s' "$1" | sed 's/[][\\.*^$+?(){}|/]/\\&/g'; }
        # One lookahead requiring any of the given tags as a whole word of the title.
        tag_lookahead() {
          local alternatives='' tag
          for tag in ${1//,/ }; do
            [[ $tag == @* ]] || tag="@$tag"
            alternatives+="${alternatives:+|}$(escape "$tag")"
          done
          [ -n "$alternatives" ] && printf '(?=.*(?:^|\\s)(?:%s)(?:\\s|$))' "$alternatives"
        }

        lookaheads="$(tag_lookahead "$STAGE_TAG")$(tag_lookahead "$TAGS")"
        [ -n "$NAME" ] && lookaheads+="(?=.*$(escape "$NAME"))"
        selection=()
        # That deployment may be a shared site, so stay modest.
        [ -n "${APP_URL:-}" ] && selection+=(--workers=2)
        [ -n "$lookaheads" ] && selection+=(--grep "^$lookaheads")

        read -ra paths <<< "$PATHS"
        for spec in "${paths[@]}"; do
          if [[ $spec == -* ]]; then
            echo "::error::The path filter takes spec files or folders, not options: '$spec'."
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        selection+=("${paths[@]}")

        # A filtered manual run may leave a job with nothing to run; that job passes and
        # its summary shows 0 tests.
        if [ -n "$TAGS$NAME$PATHS" ]; then
          selection+=(--pass-with-no-tests)
          echo "Manual selection: tag='$TAGS' name='$NAME' path='$PATHS'"
        fi

        # Word splitting is intended: COMMAND and ARGS are space-separated argument lists.
        # shellcheck disable=SC2086
        $COMMAND $ARGS "${selection[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    # The same step's latest results, to compare with: newly failing, fixed, still failing. Each
    # save has its own key, because a cache entry cannot be replaced; the prefix finds the newest.
    - name: Restore the previous run's results
      if: always()
      uses: actions/cache/restore@v6
      with:
        path: reports/ci-baseline/results.json
        key: ci-results-${{ github.workflow }}-${{ inputs.report-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ci-results-${{ github.workflow }}-${{ inputs.report-name }}-

    # Passed/failed/flaky/skipped counts and the failing tests on the run's Summary page,
    # read from the JSON report. Never fails the job; the last step does that.
    - name: Summarize results
      id: summary
      if: always()
      shell: bash
      env:
        CI_BASELINE_FILE: reports/ci-baseline/results.json
        REPORT_NAME: ${{ inputs.report-name }}
        TAGS: ${{ inputs.tag }}
        NAME: ${{ inputs.name }}
        PATHS: ${{ inputs.paths }}
        PUBLISH_HTML_REPORT: ${{ inputs.publish-html-report }}
      run: |
        # APP_URL / APP_API_URL come from the calling step's env on a manual run with overrides.
        note=''
        if [ -n "$TAGS$NAME$PATHS" ]; then
          note="Manual selection: tag \`${TAGS:-any}\`, name \`${NAME:-any}\`, path \`${PATHS:-any}\`. "
        fi
        [ -n "${APP_URL:-}" ] && note+="App URL \`$APP_URL\`. "
        [ -n "${APP_API_URL:-}" ] && note+="API URL \`$APP_API_URL\`. Traces not uploaded: they could hold a live token. "
        if [ "$PUBLISH_HTML_REPORT" != "true" ]; then
          note+="HTML report not published: its failure pages and step titles can contain shared credentials and this repository's artifacts are public (repository variable PUBLISH_REPORTS). The Allure report and the traces of failed tests are attached."
        fi
        # A filtered run or one against another URL is not a fair comparison for the next run.
        update=true
        [ -n "$TAGS$NAME$PATHS${APP_URL:-}${APP_API_URL:-}" ] && update=false
        CI_BASELINE_UPDATE="$update" CI_SUMMARY_NOTE="$note" node scripts/ci-summary.mjs "$REPORT_NAME"

    - name: Save this run's results for the next comparison
      if: always() && steps.summary.outputs.baseline-updated == 'true'
      uses: actions/cache/save@v6
      with:
        path: reports/ci-baseline/results.json
        key: ci-results-${{ github.workflow }}-${{ inputs.report-name }}-${{ github.run_id }}-${{ github.run_attempt }}

    # A selection with no specs writes no reports; that is not an error.
    - name: Publish HTML report
      if: always() && inputs.publish-html-report == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report-${{ inputs.report-name }}
        path: reports/playwright-report
        retention-days: 30
        if-no-files-found: ignore

    - name: Publish current Allure report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: allure-report-${{ inputs.report-name }}
        path: reports/allure-report/index.html
        retention-days: 30
        # A missing report is either a selection with no specs or a failed generation (see the run's log).
        if-no-files-found: warn

    # Names and outcomes only, which scripts/quality-dashboard.mjs combines across a run's jobs.
    - name: Slim the JSON results
      if: always()
      shell: bash
      run: node scripts/slim-results.mjs reports/json-report/test-results.json reports/json-report/results-slim.json

    - name: Publish the slim results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ inputs.report-name }}
        path: reports/json-report/results-slim.json
        retention-days: 7
        if-no-files-found: ignore

    # Too large for the Allure report (src/utils/AllureReport.ts). `setup` and LoginTests, which
    # type the admin password, record none. Open one with `npx playwright show-trace trace.zip`.
    - name: Publish traces of failed tests
      # A trace from another deployment could hold a token that still works, and this repository is public.
      if: always() && !github.event.inputs.app_url && !github.event.inputs.api_url
      uses: actions/upload-artifact@v7
      with:
        name: traces-${{ inputs.report-name }}
        path: test-results/**/trace.zip
        retention-days: 7
        if-no-files-found: ignore

    - name: Reflect test outcome
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        if [ "${EXIT_CODE:-1}" != "0" ]; then
          echo "::error::The specs failed (exit code ${EXIT_CODE:-unknown}); see the reports above."
          exit 1
        fi
