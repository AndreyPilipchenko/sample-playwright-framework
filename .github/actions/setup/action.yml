name: Set up the project
description: Node, npm dependencies, the requested Playwright browsers and their system packages (both cached). Run after actions/checkout.

inputs:
  browsers:
    description: >-
      Space-separated Playwright browsers to install (chromium, firefox, webkit), or 'none' for
      jobs that run only browserless (API) specs. Chromium is always added to any other list:
      the auth `setup` project (setup/auth.setup.ts) runs on Desktop Chrome before every browser
      project, so a firefox- or webkit-only job still needs chromium's headless shell.
    default: 'chromium firefox webkit'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # One normalized list for the cache key and both install commands: chromium plus the
    # requested browsers, de-duplicated and sorted, so `webkit` and `chromium webkit` share a
    # key. Also reads the Playwright version, which the binaries are tied to.
    - name: Resolve the browsers to install
      if: inputs.browsers != 'none'
      id: playwright
      shell: bash
      env:
        REQUESTED: ${{ inputs.browsers }}
      run: |
        list=$(printf '%s\n' chromium $REQUESTED | sort -u | tr '\n' ' ' | sed 's/ $//')
        echo "Installing Playwright browsers: $list"
        echo "browsers=$list" >> "$GITHUB_OUTPUT"
        echo "key=$(echo "$list" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Browser binaries are large and change only with the Playwright version; the key also
    # names the browser set, so a job never restores a cache that lacks one of its browsers.
    - name: Cache Playwright browsers
      if: inputs.browsers != 'none'
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.key }}

    - name: Install browsers
      if: inputs.browsers != 'none' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ steps.playwright.outputs.browsers }}
      run: |
        # shellcheck disable=SC2086 # BROWSERS is a space-separated list
        timeout 10m npx playwright install $BROWSERS || {
          echo "::error::Downloading the Playwright browsers failed or took longer than 10 minutes."
          exit 1
        }

    # The system packages the browsers need (about 200 for webkit) come from the Ubuntu package
    # mirror on every run, and a slow mirror once stretched webkit's setup past 15 minutes.
    # apt keeps the downloaded .deb files in our own directory, which is cached: a hit installs
    # without downloading, and a near miss (new runner image) downloads only what changed.
    - name: Keep downloaded system packages for the cache
      if: inputs.browsers != 'none'
      id: apt
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
        BROWSER_KEY: ${{ steps.playwright.outputs.key }}
      run: |
        dir="$HOME/.cache/playwright-apt"
        mkdir -p "$dir/partial"
        # The download sandbox user (_apt) cannot write under $HOME, so apt downloads as root.
        printf '%s\n' \
          "Dir::Cache::Archives \"$dir/\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          'APT::Sandbox::User "root";' \
          | sudo tee /etc/apt/apt.conf.d/99-playwright-apt-cache > /dev/null
        # ImageOS / ImageVersion are the hosted runner image's own variables: packages are built
        # for one Ubuntu release, and each weekly image refresh starts a new key (the prefix
        # still restores the previous one, so only changed packages download).
        prefix="playwright-apt-$RUNNER_OS_NAME-${ImageOS:-unknown}-$PLAYWRIGHT_VERSION-$BROWSER_KEY"
        echo "prefix=$prefix-" >> "$GITHUB_OUTPUT"
        echo "key=$prefix-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore cached system packages
      if: inputs.browsers != 'none'
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.apt.outputs.key }}
        restore-keys: ${{ steps.apt.outputs.prefix }}

    - name: Install system dependencies
      if: inputs.browsers != 'none'
      shell: bash
      env:
        BROWSERS: ${{ steps.playwright.outputs.browsers }}
      run: |
        # shellcheck disable=SC2086 # BROWSERS is a space-separated list
        timeout 10m npx playwright install-deps $BROWSERS || {
          echo "::error::Installing the browsers' system packages failed or took longer than 10 minutes; a slow Ubuntu package mirror is the usual cause. Re-run the job."
          exit 1
        }
        echo "Cached system packages: $(find "$HOME/.cache/playwright-apt" -maxdepth 1 -name '*.deb' | wc -l)"

    # Saved right away rather than at the end of the job, so a red test run still keeps it.
    - name: Save system packages to the cache
      if: inputs.browsers != 'none' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.apt.outputs.key }}

    # Fail here, with the browser named, rather than inside the first spec that launches it
    # (headless chromium runs the headless shell, so that is the binary checked for it).
    - name: Verify the browsers are installed
      if: inputs.browsers != 'none'
      shell: bash
      run: |
        missing=0
        for browser in ${{ steps.playwright.outputs.browsers }}; do
          case "$browser" in
            chromium) dir=chromium_headless_shell ;;
            *) dir=$browser ;;
          esac
          if ls -d ~/.cache/ms-playwright/"$dir"-* >/dev/null 2>&1; then
            echo "ok: $browser"
          else
            echo "::error::Playwright browser '$browser' is not installed (no ~/.cache/ms-playwright/$dir-*)"
            missing=1
          fi
        done
        exit $missing
