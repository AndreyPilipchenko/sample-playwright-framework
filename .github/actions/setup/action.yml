name: Set up the project
description: Node, npm dependencies and the requested Playwright browsers (cached by Playwright version). Run after actions/checkout.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install (chromium, firefox, webkit), or 'none' for jobs that run only browserless (API) specs.
    default: 'chromium firefox webkit'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Read the Playwright version
      if: inputs.browsers != 'none'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Browser binaries are large and change only with the Playwright version; the key also
    # names the requested browsers, so a one-browser job never restores or saves a partial
    # cache under the key of the full set.
    - name: Cache Playwright browsers
      if: inputs.browsers != 'none'
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}

    - name: Install browsers and system dependencies
      if: inputs.browsers != 'none' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}

    # System packages (apt) are not part of the cache, so install them even on a hit.
    - name: Install system dependencies only
      if: inputs.browsers != 'none' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps ${{ inputs.browsers }}
