# Smoke tests on every commit to the PRODUCT repository's main branch. That repository's
# workflow sends a `repository_dispatch` of type `product-main-push` here (a sample to copy is
# docs/ci/product-repo-trigger.yml; README "CI" explains the token it needs). The full suite
# runs nightly (nightly.yml). This repository is the test project, not the product, so its own
# commits and pull requests run nothing but the static checks (`lint.yml`).
#
# Reusable steps live in .github/actions/: setup (Node, dependencies, browsers), start-local-app
# (the Docker stack), run-specs (run Playwright, publish the reports, reflect the outcome) and
# publish-app-logs.
#
# Run it by hand: Actions → Smoke on product commit → Run workflow, or
# `gh workflow run smoke-on-commit.yml`.
#
# Manual-run inputs (all optional; blank means "as configured"):
#   target            local stack (default), or one of the two public sites; the workflow's env
#                     sets its API address. A public site's run starts no stack, uses 2 workers,
#                     uploads no traces, which could hold a live token, and leaves out the @db
#                     tests. The repository's admin login is sent to that site. Tests that need the
#                     local mail inbox fail.
#   tag, name, path   narrow what runs: tests with any of the tags (comma-separated), a title
#                     containing the text, in the given spec files/folders (:line allowed).
#                     They narrow the @smoke selection; nothing outside @smoke runs here.
#   e.g. gh workflow run smoke-on-commit.yml -f name="admin credentials" -f target=https://with-bugs.practicesoftwaretesting.com/
#
# RUNNER: ubuntu-latest has Docker and compose preinstalled; start-local-app adds the arm64 emulation
# the shop's images need.
#
# SECRETS: APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD (the shared demo admin, docs/test-plan.md
# §1.2) are mapped onto the spec-running steps only. The customer needs no secret: the setup
# registers a disposable one every run. With an empty admin secret, the admin specs fail with "No saved session". Mind
# defect #21: one failed login locks the account, so check a value before saving it.
#
# REPORTS: native report detail (Playwright step titles, failure pages, traces) can contain the
# admin credentials. They are the published demo account, so the Allure report and the traces of
# failed tests (`traces-*`, 7 days) are always attached; this repository is public, so the jobs that
# sign in attach the Playwright HTML report only when the repository variable PUBLISH_REPORTS is 'true'.

name: Smoke on product commit

# The product commit under test, so each run is traceable to it.
run-name: "${{ github.event_name == 'repository_dispatch' && format('Smoke: {0}@{1}', github.event.client_payload.repository, github.event.client_payload.sha) || 'Smoke (manual run)' }}"

on:
  repository_dispatch:
    types: [product-main-push]
  workflow_dispatch:
    # Manual runs only; every other trigger leaves them empty, which means "as configured".
    inputs:
      target:
        description: Site to test. The local stack is a private copy started on the runner; a public site's tests skip those that use the database
        type: choice
        default: local stack
        options:
          - local stack
          - https://practicesoftwaretesting.com/
          - https://with-bugs.practicesoftwaretesting.com/
      tag:
        description: Only tests with any of these tags, comma-separated (e.g. @smoke, @regression)
        type: string
        default: ''
      name:
        description: Only tests whose title contains this text, case-insensitive
        type: string
        default: ''
      path:
        description: Only these spec files or folders, space-separated, optional :line (e.g. tests/ui/accounts/LoginTests.spec.ts:38)
        type: string
        default: ''

# Smoke runs queue behind each other. Product pushes can arrive in bursts; GitHub keeps one
# pending run per group, so a newer push replaces an older one that has not started yet (the
# newest commit is the one worth testing). The group is separate from nightly.yml's, so a
# product push can never cancel a pending nightly run.
concurrency:
  group: test-suite-smoke
  cancel-in-progress: false

# The site picked for a manual run, with its API. Empty on any other trigger and for the local stack.
env:
  APP_URL: ${{ startsWith(inputs.target, 'https://') && inputs.target || '' }}
  APP_API_URL: ${{ inputs.target == 'https://practicesoftwaretesting.com/' && 'https://api.practicesoftwaretesting.com' || inputs.target == 'https://with-bugs.practicesoftwaretesting.com/' && 'https://api-with-bugs.practicesoftwaretesting.com' || '' }}

jobs:
  # The smoke subset on chromium, against a private local instance started on the runner.
  smoke-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node, dependencies and browsers
        uses: ./.github/actions/setup

      - name: Start the application under test
        if: env.APP_URL == ''
        uses: ./.github/actions/start-local-app

      - name: Run the @smoke specs
        uses: ./.github/actions/run-specs
        with:
          command: node scripts/app.mjs test
          args: --project=chromium
          stage-tag: '@smoke'
          report-name: smoke-local
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          paths: ${{ inputs.path }}
          publish-html-report: ${{ vars.PUBLISH_REPORTS == 'true' }}
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Publish application logs
        if: failure() && env.APP_URL == ''
        uses: ./.github/actions/publish-app-logs
        with:
          artifact-name: app-logs-smoke-local

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true
