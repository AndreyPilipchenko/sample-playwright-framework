# The FULL suite every night on the default branch (GitHub runs `schedule` triggers only
# there). Product commits run only the smoke tests (smoke-on-commit.yml). Tests of broken
# functionality assert the documented behaviour, so they fail (and the run is red) until the
# product fixes them (docs/test-plan.md §4.1).
#
# STAGES — each starts only when the one before it passed:
#   1. api-tests   static checks, then the browserless API specs (tests/api)
#   2. smoke       the @smoke subset on chromium, firefox and webkit
#   3. regression  every other spec on chromium, in parallel shards
# api-local, smoke-local and regression-local run the same three selections, each against its
# own private Docker instance. They start together and gate nothing.
#
# Reusable steps live in .github/actions/: setup (Node, dependencies, browsers),
# static-checks (conventions, type-check, lint) and run-specs (run Playwright, publish the
# reports, reflect the outcome).
#
# Run it by hand: Actions → Nightly tests → Run workflow, or `gh workflow run nightly.yml`.
#
# Manual-run inputs (all optional; blank means "as configured"):
#   app_url, api_url  test another deployment (APP_URL / APP_API_URL, src/config/targets.ts)
#   tag, name, path   narrow what runs: tests with any of the tags (comma-separated), a title
#                     containing the text, in the given spec files/folders (:line allowed).
#                     They narrow each stage's own selection, so a stage can end up empty;
#                     an empty stage passes and its summary says no tests matched.
#   The local jobs take the filters but never the URL overrides (they test their own stacks).
#   e.g. gh workflow run nightly.yml -f tag=@regression -f path=tests/ui/checkout/CartTests.spec.ts
#
# RUNNER: ubuntu-latest reaches the configured target (https://with-bugs.practicesoftwaretesting.com)
# fine since it's a public site — no self-hosted runner needed.
#
# SECRETS: APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD (the shared demo admin, docs/test-plan.md
# §1.2) are mapped onto the spec-running steps only. The customer needs no secret: the setup
# registers a disposable one every run. With an empty admin secret, the admin specs fail with "No saved session". Mind
# defect #21: one failed login locks the account, so check a value before saving it.
#
# REPORTS: native report detail (Playwright step titles, failure pages, traces) can contain the
# admin credentials. They are the published demo account, so the Allure report and the traces of
# failed tests (`traces-*`, 7 days) are always attached; this repository is public, so the jobs that
# sign in attach the Playwright HTML report only when the repository variable PUBLISH_REPORTS is 'true'.
#
# WORKERS: 2 on CI (playwright.config.ts). The hosted target is a shared public site, so keep
# this low per job; the regression stage scales by adding shards (matrix `shard`, and the
# `/2` in its args) rather than workers.

name: Nightly tests

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every day
  workflow_dispatch:
    # Manual runs only; every other trigger leaves them empty, which means "as configured".
    inputs:
      app_url:
        description: App base URL to test instead of the configured target (blank = configured)
        type: string
        default: ''
      api_url:
        description: API base URL to use instead of the configured target (blank = configured)
        type: string
        default: ''
      tag:
        description: Only tests with any of these tags, comma-separated (e.g. @smoke, @regression)
        type: string
        default: ''
      name:
        description: Only tests whose title contains this text, case-insensitive
        type: string
        default: ''
      path:
        description: Only these spec files or folders, space-separated, optional :line (e.g. tests/ui/accounts/LoginTests.spec.ts:38)
        type: string
        default: ''

# Its own group, separate from smoke-on-commit.yml's: GitHub keeps one pending run per group,
# so a shared group would let a product push cancel a waiting nightly run. A nightly run may
# therefore overlap a smoke run now and then.
concurrency:
  group: test-suite-nightly
  cancel-in-progress: false

jobs:
