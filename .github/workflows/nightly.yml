# The full suite every night (default branch only), on both local builds, each in its own Docker stack:
# a matrix of environment x suite (api, smoke per browser, regression), then the results go to GitHub Pages.
# Tests of broken functionality fail until the product is fixed (docs/test-plan.md §4.1).
# Inputs, jobs, secrets and reports: docs/ci-guide.md. Run by hand: gh workflow run nightly.yml

name: Nightly tests

# The environments under test, visible in the run list.
run-name: Nightly tests on ${{ (inputs.environment == 'local' || inputs.environment == 'local-fixed') && inputs.environment || 'local and local-fixed' }}

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every day
  workflow_dispatch:
    # Manual runs only; every other trigger leaves them empty, which means "as configured".
    inputs:
      environment:
        description: Build to test, each in a private Docker stack on the runner. local has the deliberate defects, local-fixed is the newer build without them
        type: choice
        default: both
        options:
          - both
          - local
          - local-fixed
      tag:
        description: Only tests with any of these tags, comma-separated (e.g. @smoke, @regression)
        type: string
        default: ''
      name:
        description: Only tests whose title contains this text, case-insensitive
        type: string
        default: ''
      path:
        description: Only these spec files or folders, space-separated, optional :line (e.g. tests/ui/accounts/LoginTests.spec.ts:38)
        type: string
        default: ''

# Its own group, separate from smoke-on-commit.yml's and hosted.yml's: GitHub keeps one pending run
# per group, so a shared group would let a product push cancel a waiting nightly run. A nightly
# run may therefore overlap a smoke run now and then.
concurrency:
  group: test-suite-nightly
  cancel-in-progress: false

jobs:
  # One job per suite and environment, each bringing the application under test up on its own
  # runner and testing that private instance, with its own stack, report and summary. They start
  # together, fail-fast is off and nothing `needs` them but publish-site, so one job's failure
  # hides no other job's results. `suite` is also the report name's suffix (scripts/build-site.mjs).
  tests:
    name: ${{ matrix.title }} on ${{ matrix.environment }}
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run and the manual default (both) test both builds.
        environment: ${{ fromJSON((inputs.environment == 'local' || inputs.environment == 'local-fixed') && format('["{0}"]', inputs.environment) || '["local","local-fixed"]') }}
        suite: [api, smoke-chromium, smoke-firefox, smoke-webkit, regression]
        # database: the disabled-account cases (TC-LOGIN-10, TC-ADM-9, customer-account-api-6) disable
        # their account in the local MariaDB, so those suites get APP_DB_LOCAL
        # (JSON {"user":…,"password":…}).
        include:
          - { suite: api, title: API specs, browsers: none, project: api, stage-tag: '@regression,@local', timeout: 30, database: true }
          - { suite: smoke-chromium, title: Smoke on chromium, browsers: chromium, project: chromium, stage-tag: '@smoke', timeout: 30, database: false }
          - { suite: smoke-firefox, title: Smoke on firefox, browsers: firefox, project: firefox, stage-tag: '@smoke', timeout: 30, database: false }
          - { suite: smoke-webkit, title: Smoke on webkit, browsers: webkit, project: webkit, stage-tag: '@smoke', timeout: 30, database: false }
          - { suite: regression, title: Regression, browsers: chromium, project: chromium, stage-tag: '@regression,@local', timeout: 60, database: true }
    # The environment under test (.harness/project.json).
    env:
      TEST_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node, dependencies and browsers (${{ matrix.browsers }})
        uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browsers }}

      - name: Start the application under test
        uses: ./.github/actions/start-local-app
        with:
          environment: ${{ matrix.environment }}

      - name: Run the ${{ matrix.stage-tag }} specs on ${{ matrix.project }}
        uses: ./.github/actions/run-specs
        with:
          args: -- --project=${{ matrix.project }}
          stage-tag: ${{ matrix.stage-tag }}
          report-name: ${{ matrix.environment }}-${{ matrix.suite }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          paths: ${{ inputs.path }}
          publish-html-report: ${{ vars.PUBLISH_REPORTS == 'true' }}
        # The local stack seeds the same demo accounts as the public sites.
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_DB_LOCAL: ${{ matrix.database && secrets.APP_DB_LOCAL || '' }}

      - name: Publish application logs
        if: failure()
        uses: ./.github/actions/publish-app-logs
        with:
          artifact-name: app-logs-${{ matrix.environment }}-${{ matrix.suite }}

  # Publishes the latest full run to GitHub Pages: the results dashboard and each job's Allure report.
  # The dashboard shows both builds side by side and compares them (scripts/quality-dashboard.mjs).
  # A failing test doesn't stop it, since failures are what the site shows, but a filtered run, or
  # one that tested a single build, would replace the full results, so it doesn't publish. It needs
  # Settings > Pages > Source set to GitHub Actions.
  publish-site:
    needs: [tests]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.tag == '' && inputs.name == '' && inputs.path == '' && inputs.environment != 'local' && inputs.environment != 'local-fixed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the Allure reports
        uses: actions/download-artifact@v8
        with:
          pattern: allure-report-*
          path: artifacts

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: artifacts

      - name: Build the site
        run: node scripts/build-site.mjs artifacts site

      - name: Check the site for secrets
        run: node scripts/check-site-secrets.mjs site
        env:
          APP_DB_LOCAL: ${{ secrets.APP_DB_LOCAL }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy the site
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the dashboard from the run's summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          {
            echo '### Results dashboard'
            echo "[Open the dashboard]($PAGE_URL). It always shows the latest published run, which may be newer than this one."
          } >> "$GITHUB_STEP_SUMMARY"
