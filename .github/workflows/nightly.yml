# The FULL suite every night on the default branch (GitHub runs `schedule` triggers only
# there). Product commits run only the smoke tests (smoke-on-commit.yml). Tests of broken
# functionality assert the documented behaviour, so they fail (and the run is red) until the
# product fixes them (docs/test-plan.md §4.1).
#
# JOBS start together and gate nothing; each tests its own private Docker instance:
#   api-local         the browserless API specs (tests/api), @regression and, on the local stack, @local
#   smoke-local       the @smoke subset, one job per browser (chromium, firefox, webkit)
#   regression-local  the @regression specs on chromium and, on the local stack, the @local ones
# publish-site then puts the results on GitHub Pages.
#
# Reusable steps live in .github/actions/: setup (Node, dependencies, browsers), start-local-app
# (the Docker stack), run-specs (run Playwright, publish the reports, reflect the outcome) and
# publish-app-logs. Static checks run on pull requests (lint.yml).
#
# Run it by hand: Actions → Nightly tests → Run workflow, or `gh workflow run nightly.yml`.
#
# Manual-run inputs (all optional; blank means "as configured"):
#   target            local stack (default), or one of the two public sites; the workflow's env
#                     sets its API address. A public site's run starts no stack, uses 2 workers,
#                     uploads no traces, which could hold a live token, and leaves out the @local
#                     tests, which need the stack's database or mail inbox. The repository's admin
#                     login is sent to that site.
#   tag, name, path   narrow what runs: tests with any of the tags (comma-separated), a title
#                     containing the text, in the given spec files/folders (:line allowed).
#                     They narrow each job's own selection, so a job can end up empty;
#                     an empty job passes and its summary says no tests matched.
#   e.g. gh workflow run nightly.yml -f tag=@regression -f path=tests/ui/checkout/CartTests.spec.ts
#
# RUNNER: ubuntu-latest has Docker and compose preinstalled; start-local-app adds the arm64 emulation
# the shop's images need.
#
# SECRETS: APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD (the shared demo admin, docs/test-plan.md
# §1.2) are mapped onto the spec-running steps only. The customer needs no secret: the setup
# registers a disposable one every run. With an empty admin secret, the admin specs fail with "No saved session". Mind
# defect #21: one failed login locks the account, so check a value before saving it.
#
# REPORTS: native report detail (Playwright step titles, failure pages, traces) can contain the
# admin credentials. They are the published demo account, so the Allure report and the traces of
# failed tests (`traces-*`, 7 days) are always attached; this repository is public, so the jobs that
# sign in attach the Playwright HTML report only when the repository variable PUBLISH_REPORTS is 'true'.
# publish-site puts the Allure reports on a public page, so it checks them for secrets first.
#
# WORKERS: 3 (playwright.config.ts), since each job tests its own private Docker stack. A manual
# run against another deployment uses 2 (run-specs), because that site may be shared.

name: Nightly tests

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every day
  workflow_dispatch:
    # Manual runs only; every other trigger leaves them empty, which means "as configured".
    inputs:
      target:
        description: Site to test. The local stack is a private copy started on the runner; a public site's run leaves out the @local tests
        type: choice
        default: local stack
        options:
          - local stack
          - https://practicesoftwaretesting.com/
          - https://with-bugs.practicesoftwaretesting.com/
      tag:
        description: Only tests with any of these tags, comma-separated (e.g. @smoke, @regression)
        type: string
        default: ''
      name:
        description: Only tests whose title contains this text, case-insensitive
        type: string
        default: ''
      path:
        description: Only these spec files or folders, space-separated, optional :line (e.g. tests/ui/accounts/LoginTests.spec.ts:38)
        type: string
        default: ''

# Its own group, separate from smoke-on-commit.yml's: GitHub keeps one pending run per group,
# so a shared group would let a product push cancel a waiting nightly run. A nightly run may
# therefore overlap a smoke run now and then.
concurrency:
  group: test-suite-nightly
  cancel-in-progress: false

# The site picked for a manual run, with its API. Empty on any other trigger and for the local stack.
env:
  APP_URL: ${{ startsWith(inputs.target, 'https://') && inputs.target || '' }}
  APP_API_URL: ${{ inputs.target == 'https://practicesoftwaretesting.com/' && 'https://api.practicesoftwaretesting.com' || inputs.target == 'https://with-bugs.practicesoftwaretesting.com/' && 'https://api-with-bugs.practicesoftwaretesting.com' || '' }}

jobs:
  # These bring the application under test up on their own runners and test that private
  # instance, not the shared public one. Each has its own stack, report and summary. They start
  # together and have no `needs`, so one job's failure hides no other job's results.
  api-local:
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node and dependencies (no browsers)
        uses: ./.github/actions/setup
        with:
          browsers: none

      - name: Start the application under test
        if: env.APP_URL == ''
        uses: ./.github/actions/start-local-app

      # The @local tests need the local stack's database or mail inbox.
      - name: Pick the tags to run
        id: tags
        run: |
          tags='@regression'
          [ -n "$APP_URL" ] || tags+=',@local'
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Run the API specs
        uses: ./.github/actions/run-specs
        with:
          command: node scripts/app.mjs test
          args: -- --project=api
          stage-tag: ${{ steps.tags.outputs.tags }}
          report-name: local-api
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          paths: ${{ inputs.path }}
          publish-html-report: ${{ vars.PUBLISH_REPORTS == 'true' }}
        # The local stack seeds the same demo accounts as the hosted target. APP_DB_LOCAL: the
        # disabled-account case (customer-account-api-6) disables its account in the database.
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_DB_LOCAL: ${{ secrets.APP_DB_LOCAL }}

      - name: Publish application logs
        if: failure() && env.APP_URL == ''
        uses: ./.github/actions/publish-app-logs
        with:
          artifact-name: app-logs-local-api

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true

  # One job per browser; fail-fast is off so one browser's failure does not cancel the others.
  smoke-local:
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node, dependencies and ${{ matrix.browser }}
        uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}

      - name: Start the application under test
        if: env.APP_URL == ''
        uses: ./.github/actions/start-local-app

      - name: Run the @smoke specs on ${{ matrix.browser }}
        uses: ./.github/actions/run-specs
        with:
          command: node scripts/app.mjs test
          args: -- --project=${{ matrix.browser }}
          stage-tag: '@smoke'
          report-name: local-smoke-${{ matrix.browser }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          paths: ${{ inputs.path }}
          publish-html-report: ${{ vars.PUBLISH_REPORTS == 'true' }}
        # The local stack seeds the same demo accounts as the hosted target.
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Publish application logs
        if: failure() && env.APP_URL == ''
        uses: ./.github/actions/publish-app-logs
        with:
          artifact-name: app-logs-local-smoke-${{ matrix.browser }}

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true

  regression-local:
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node, dependencies and chromium
        uses: ./.github/actions/setup
        with:
          browsers: chromium

      - name: Start the application under test
        if: env.APP_URL == ''
        uses: ./.github/actions/start-local-app

      # The @local tests need the local stack's database or mail inbox.
      - name: Pick the tags to run
        id: tags
        run: |
          tags='@regression'
          [ -n "$APP_URL" ] || tags+=',@local'
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Run the regression specs
        uses: ./.github/actions/run-specs
        with:
          command: node scripts/app.mjs test
          args: -- --project=chromium
          stage-tag: ${{ steps.tags.outputs.tags }}
          report-name: local-regression
          tag: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          paths: ${{ inputs.path }}
          publish-html-report: ${{ vars.PUBLISH_REPORTS == 'true' }}
        # The local stack seeds the same demo accounts as the hosted target. APP_DB_LOCAL holds the
        # local MariaDB credentials as JSON ({"user":…,"password":…}); TC-LOGIN-10 disables its
        # account in the database, the only route this build offers.
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_DB_LOCAL: ${{ secrets.APP_DB_LOCAL }}

      - name: Publish application logs
        if: failure() && env.APP_URL == ''
        uses: ./.github/actions/publish-app-logs
        with:
          artifact-name: app-logs-local-regression

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true

  # Publishes the latest full run to GitHub Pages: the results dashboard and each job's Allure report.
  # A failing test doesn't stop it, since failures are what the site shows, but a filtered run or
  # one against another URL would replace the full results, so those don't publish. It needs
  # Settings > Pages > Source set to GitHub Actions.
  publish-site:
    needs: [api-local, smoke-local, regression-local]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.tag == '' && inputs.name == '' && inputs.path == '' && !startsWith(inputs.target, 'https://') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the Allure reports
        uses: actions/download-artifact@v8
        with:
          pattern: allure-report-local-*
          path: artifacts

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-local-*
          path: artifacts

      - name: Build the site
        run: node scripts/build-site.mjs artifacts site

      - name: Check the site for secrets
        run: node scripts/check-site-secrets.mjs site
        env:
          APP_DB_LOCAL: ${{ secrets.APP_DB_LOCAL }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy the site
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the dashboard from the run's summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          {
            echo '### Results dashboard'
            echo "[Open the dashboard]($PAGE_URL). It always shows the latest published run, which may be newer than this one."
          } >> "$GITHUB_STEP_SUMMARY"
