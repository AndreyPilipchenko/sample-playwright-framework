# The FULL suite every night on the default branch (GitHub runs `schedule` triggers only
# there). Product commits run only the smoke tests (smoke-on-commit.yml). Tests of broken
# functionality assert the documented behaviour, so they fail (and the run is red) until the
# product fixes them (docs/test-plan.md §4.1).
#
# STAGES — each starts only when the one before it passed:
#   1. api-tests   static checks, then the browserless API specs (tests/api)
#   2. smoke       the @smoke subset on chromium, firefox and webkit
#   3. regression  every other spec on chromium, in parallel shards
# regression-local runs the whole suite against a private Docker instance; it gates nothing.
#
# Reusable steps live in .github/actions/: setup (Node, dependencies, browsers),
# static-checks (conventions, type-check, lint) and run-specs (run Playwright, publish the
# reports, reflect the outcome).
#
# Run it by hand: Actions → Nightly tests → Run workflow, or `gh workflow run nightly.yml`.
#
# RUNNER: ubuntu-latest reaches the configured target (https://with-bugs.practicesoftwaretesting.com)
# fine since it's a public site — no self-hosted runner needed.
#
# SECRETS: none configured yet, so APP_CUSTOMER_*/APP_ADMIN_*/DB_* stay unset: the auth setup
# and the admin login spec skip, and everything else runs. Add the GitHub Actions secrets and
# uncomment the env mapping in the smoke job to run them here.
#
# WORKERS: 2 on CI (playwright.config.ts). The hosted target is a shared public site, so keep
# this low per job; the regression stage scales by adding shards (matrix `shard`, and the
# `/2` in its args) rather than workers.

name: Nightly tests

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every day
  workflow_dispatch: {}

# Its own group, separate from smoke-on-commit.yml's: GitHub keeps one pending run per group,
# so a shared group would let a product push cancel a waiting nightly run. A nightly run may
# therefore overlap a smoke run now and then.
concurrency:
  group: test-suite-nightly
  cancel-in-progress: false

jobs:
  # Stage 1. Static checks run once, here only (regression-local exercises the same code).
  # They are fast and fail before any spec runs.
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node and dependencies (no browsers)
        uses: ./.github/actions/setup
        with:
          browsers: none

      - name: Static checks
        uses: ./.github/actions/static-checks

      - name: Run API specs
        uses: ./.github/actions/run-specs
        with:
          args: --project=api
          report-name: api

  # Stage 2. The critical-path subset in every browser, side by side; fail-fast is off so one
  # browser's failure does not hide another's result.
  smoke:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node, dependencies and ${{ matrix.browser }}
        uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}

      - name: Run the @smoke specs on ${{ matrix.browser }}
        uses: ./.github/actions/run-specs
        with:
          args: --project=${{ matrix.browser }} --grep @smoke
          report-name: smoke-${{ matrix.browser }}
        # env:                  # uncomment after adding the repo secrets
        #   APP_CUSTOMER_USERNAME: ${{ secrets.APP_CUSTOMER_USERNAME }}
        #   APP_CUSTOMER_PASSWORD: ${{ secrets.APP_CUSTOMER_PASSWORD }}
        #   APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
        #   APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

  # Stage 3. Everything that is not @smoke, on chromium only (the full functional suite is
  # chromium-only, see playwright.config.ts), in parallel shards that start together once
  # smoke passed in every browser. Tests of broken functionality fail here until it is fixed.
  regression:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node, dependencies and chromium
        uses: ./.github/actions/setup
        with:
          browsers: chromium

      - name: Run the non-smoke specs, shard ${{ matrix.shard }} of 2
        uses: ./.github/actions/run-specs
        with:
          args: --project=chromium --grep-invert @smoke --shard=${{ matrix.shard }}/2 --pass-with-no-tests
          report-name: regression-${{ matrix.shard }}

  # Brings the application under test up on the runner itself and runs the whole suite against
  # that private instance instead of the shared public one. A separate job rather than a stage:
  # it answers a different question (does the suite pass against a known-good, freshly seeded
  # instance), must not share a failure with the hosted-target stages, and carries a much
  # heavier setup cost. It has no `needs`, so it runs alongside stage 1 and gates nothing.
  regression-local:
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node, dependencies and browsers
        uses: ./.github/actions/setup

      # The upstream `web` (nginx) and `cron` images are published for linux/arm64
      # only, while this runner is amd64. Docker Desktop emulates arm64 out of the
      # box; a GitHub-hosted runner does not, so without binfmt handlers the `web`
      # container — the proxy that serves the API on 8091 — fails to start and the
      # stack never becomes ready. Verified locally: web/cron are arm64, ui/api amd64.
      - name: Enable arm64 emulation for the upstream nginx/cron images
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Start the application under test
        run: node scripts/app.mjs up --timeout 900

      - name: Run Playwright specs against the local instance
        uses: ./.github/actions/run-specs
        with:
          command: node scripts/app.mjs test
          report-name: local

      # Container logs are the only way to diagnose an application-side failure after the
      # runner is torn down, so capture them whenever the run did not pass.
      - name: Capture application logs
        if: failure()
        run: node scripts/app.mjs logs > app-logs.txt 2>&1 || true

      - name: Publish application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-local
          path: app-logs.txt
          retention-days: 30

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true
