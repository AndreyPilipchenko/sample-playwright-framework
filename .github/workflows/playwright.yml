# Adapted from node_modules/playwright-pom-harness/examples/github-actions-playwright.yml
#
# SCOPE — CI validation only: the harness's delivery scripts
# (scripts/fetch-ado-suite.mjs, scripts/ado-pr.mjs, scripts/publish-ado-results.mjs)
# speak the Azure DevOps REST API. On this GitHub-hosted project this workflow runs
# the specs and publishes the report artifacts; ADO delivery is not configured here.
#
# PULL REQUEST GATE — kept small and fast, two stages:
#   1. api-tests  static checks, then the browserless API specs (tests/api)
#   2. smoke      the @smoke subset on chromium, once api-tests passed
# Everything else (firefox/webkit smoke, every non-smoke spec including the @conformance
# tests, and the run against a local Docker instance) runs nightly: see nightly.yml.
#
# RUNNER: ubuntu-latest reaches the configured target (https://with-bugs.practicesoftwaretesting.com)
# fine since it's a public site — no self-hosted runner needed.
#
# SECRETS: none configured yet, so APP_CUSTOMER_*/APP_ADMIN_*/DB_* stay unset: the auth
# setup and the admin login spec skip, and everything else runs. Add the corresponding
# GitHub Actions secrets and uncomment the env mapping in the smoke job to run it here.
#
# Deliberately headless & non-interactive: AUTO_ALLURE_OPEN=false suppresses the
# Allure auto-open, PW_TEST_HTML_REPORT_OPEN=never suppresses the HTML report
# server (both would hang a CI runner).

name: Playwright tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Stage 1. Static checks run once, here only (the regression-local job exercises the same code).
  # They are fast and fail before any spec runs.
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node and dependencies (no browsers)
        uses: ./.github/actions/setup
        with:
          browsers: none

      - name: Check POM conventions
        run: npx --no pom-harness check-conventions

      - name: Type-check
        run: npm run typecheck

      - name: Lint (floating promises, missing awaits, focused tests)
        run: npm run lint

      - name: Run API specs
        id: run_specs
        run: CI=true AUTO_ALLURE_OPEN=false PW_TEST_HTML_REPORT_OPEN=never npx playwright test --project=api
        continue-on-error: true # the report upload below must run even when tests fail

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: reports/playwright-report
          retention-days: 30

      - name: Publish current Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: reports/allure-report/index.html
          retention-days: 30

      # Fail the job if the run step failed (kept explicit because the run step
      # uses continue-on-error so the artifacts above always publish):
      - name: Reflect test outcome
        if: always()
        run: |
          if [ "${{ steps.run_specs.outcome }}" = "failure" ]; then exit 1; fi

  # Stage 2. The critical-path subset on chromium. Firefox and webkit run it nightly.
  smoke:
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node, dependencies and chromium
        uses: ./.github/actions/setup
        with:
          browsers: chromium

      - name: Run the @smoke specs on chromium
        id: run_specs
        run: CI=true AUTO_ALLURE_OPEN=false PW_TEST_HTML_REPORT_OPEN=never npx playwright test --project=chromium --grep @smoke
        continue-on-error: true # reporting below must run even when tests fail
        # env:                  # uncomment after adding the repo secrets
        #   DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        #   SQLCMDPASSWORD: ${{ secrets.SQLCMDPASSWORD }}
        #   APP_CUSTOMER_USERNAME: ${{ secrets.APP_CUSTOMER_USERNAME }}
        #   APP_CUSTOMER_PASSWORD: ${{ secrets.APP_CUSTOMER_PASSWORD }}
        #   APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
        #   APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: reports/playwright-report
          retention-days: 30

      - name: Publish current Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke
          path: reports/allure-report/index.html
          retention-days: 30

      - name: Reflect test outcome
        if: always()
        run: |
          if [ "${{ steps.run_specs.outcome }}" = "failure" ]; then exit 1; fi
