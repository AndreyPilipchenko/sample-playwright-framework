# Adapted from node_modules/playwright-pom-harness/examples/github-actions-playwright.yml
#
# SCOPE — CI validation only: the harness's delivery scripts
# (scripts/fetch-ado-suite.mjs, scripts/ado-pr.mjs, scripts/publish-ado-results.mjs)
# speak the Azure DevOps REST API. On this GitHub-hosted project this workflow runs
# the specs and publishes the report artifacts; ADO delivery is not configured here.
#
# RUNNER: ubuntu-latest reaches the configured target (https://with-bugs.practicesoftwaretesting.com)
# fine since it's a public site — no self-hosted runner needed.
#
# SECRETS: none required yet — the current suite has no DB target and no login test,
# so APP_CUSTOMER_*/APP_ADMIN_*/DB_* stay unset (the auth setup skips unset roles). Add the corresponding GitHub Actions secrets and
# uncomment the env mapping below once a test needs them.
#
# Deliberately headless & non-interactive: AUTO_ALLURE_OPEN=false suppresses the
# Allure auto-open, PW_TEST_HTML_REPORT_OPEN=never suppresses the HTML report
# server (both would hang a CI runner).

name: Playwright tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check POM conventions
        run: npx --no pom-harness check-conventions

      # Static checks run once, here only; the local-app job exercises the same code.
      - name: Type-check
        run: npm run typecheck

      - name: Lint (floating promises, missing awaits, focused tests)
        run: npm run lint

      - name: Run Playwright specs
        id: run_specs
        run: CI=true AUTO_ALLURE_OPEN=false PW_TEST_HTML_REPORT_OPEN=never npx playwright test --project=chromium
        continue-on-error: true # reporting below must run even when tests fail
        # env:                  # uncomment after adding the repo secrets
        #   DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        #   SQLCMDPASSWORD: ${{ secrets.SQLCMDPASSWORD }}
        #   APP_CUSTOMER_USERNAME: ${{ secrets.APP_CUSTOMER_USERNAME }}
        #   APP_CUSTOMER_PASSWORD: ${{ secrets.APP_CUSTOMER_PASSWORD }}
        #   APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
        #   APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report
          retention-days: 30

      - name: Publish current Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/index.html
          retention-days: 30

      # Fail the job if the run step failed (kept explicit because the run step
      # uses continue-on-error so the artifacts above always publish):
      - name: Reflect test outcome
        if: always()
        run: |
          if [ "${{ steps.run_specs.outcome }}" = "failure" ]; then exit 1; fi

  # Separate job: brings the application under test up on the runner itself and runs
  # the suite against that private instance instead of the shared public one.
  #
  # Why a second job rather than a step in the one above: the two runs answer
  # different questions (is the hosted target healthy vs does the suite pass against
  # a known-good, freshly seeded instance), they must not share a failure, and this
  # one carries a much heavier setup cost. Running them in parallel also keeps total
  # wall-clock down. Artifact names are suffixed so they cannot collide with the
  # hosted job's uploads — upload-artifact@v4 rejects duplicate names across jobs.
  local-app:
    runs-on: ubuntu-latest # Docker and compose are preinstalled on GitHub-hosted runners
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The upstream `web` (nginx) and `cron` images are published for linux/arm64
      # only, while this runner is amd64. Docker Desktop emulates arm64 out of the
      # box; a GitHub-hosted runner does not, so without binfmt handlers the `web`
      # container — the proxy that serves the API on 8091 — fails to start and the
      # stack never becomes ready. Verified locally: web/cron are arm64, ui/api amd64.
      - name: Enable arm64 emulation for the upstream nginx/cron images
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Start the application under test
        run: node scripts/app.mjs up --timeout 900

      - name: Run Playwright specs against the local instance
        id: run_specs
        run: CI=true AUTO_ALLURE_OPEN=false PW_TEST_HTML_REPORT_OPEN=never node scripts/app.mjs test -- --project=chromium
        continue-on-error: true # reporting and teardown below must run even when tests fail

      # Container logs are the only way to diagnose an application-side failure after
      # the runner is torn down, so capture them whenever the run did not pass.
      - name: Capture application logs
        if: always() && steps.run_specs.outcome != 'success'
        run: node scripts/app.mjs logs > app-logs.txt 2>&1 || true

      - name: Publish application logs
        if: always() && steps.run_specs.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-local
          path: app-logs.txt
          retention-days: 30

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: reports/playwright-report
          retention-days: 30

      - name: Publish current Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-local
          path: reports/allure-report/index.html
          retention-days: 30

      - name: Stop the application under test
        if: always()
        run: node scripts/app.mjs down --volumes || true

      - name: Reflect test outcome
        if: always()
        run: |
          if [ "${{ steps.run_specs.outcome }}" = "failure" ]; then exit 1; fi
