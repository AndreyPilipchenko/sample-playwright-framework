# Static checks on every pull request: the POM conventions check, the core boundary check, the TypeScript type-check and
# the linter. No test runs here (docs/test-plan.md §4.1: the suite never runs on pull requests);
# the checks are the composite action .github/actions/static-checks.
#
# Run it by hand: Actions → Lint → Run workflow, or `gh workflow run lint.yml`.

name: Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          browsers: none

      - uses: ./.github/actions/static-checks
